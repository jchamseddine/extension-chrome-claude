<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Claude Usage</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; font-optical-sizing: auto; }
    body { width: 284px; margin: 0; padding: 14px; color: #1c1c1e; background: #f7f7f8; font-size: 13px; line-height: 1.45; }
    button, input, select { font: inherit; }
    button, input, select, label { -webkit-tap-highlight-color: transparent; }
    button, input[type="color"], input[type="checkbox"], input[type="number"], input[type="range"], select, #statusLink { transition: transform 100ms ease-out, opacity 100ms ease-out; }
    button:active, input[type="color"]:active, input[type="checkbox"]:active, input[type="number"]:active, select:active, #statusLink:active { transform: scale(.97); opacity: .78; }
    input[type="range"]:active { opacity: .72; }
    #settings label:active, #acToggle:active { opacity: .78; }
    .usage-card, .section, .disclosure { border: 1px solid rgba(60, 60, 67, .12); border-radius: 12px; background: #fff; }
    .usage-card { padding: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, .04); }
    .section, .disclosure { margin-top: 10px; }
    .section { padding: 11px 12px; }
    .section-title { margin: 0 0 7px; color: #6b7280; font-size: 11px; font-weight: 600; line-height: 1.2; letter-spacing: .035em; text-transform: uppercase; }
    .win + .win { margin-top: 13px; padding-top: 13px; border-top: 1px solid rgba(60, 60, 67, .1); }
    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .label { color: #6b7280; font-size: 12px; line-height: 1.35; letter-spacing: .005em; }
    .pct { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.035em; }
    .bar { height: 6px; margin: 7px 0 5px; overflow: hidden; border-radius: 999px; background: rgba(128, 128, 128, .2); }
    .bar > i { display: block; height: 100%; border-radius: inherit; }
    .reset { color: #6b7280; font-size: 12px; line-height: 1.35; letter-spacing: .005em; }
    .status { display: inline-block; margin-top: 6px; padding: 2px 7px; border-radius: 999px; color: #fff; font-size: 11px; font-weight: 600; line-height: 1.25; letter-spacing: .01em; }
    .usage-projection { margin: 9px 0 0; padding-top: 9px; border-top: 1px solid rgba(60, 60, 67, .1); color: #6b7280; font-size: 12px; line-height: 1.4; letter-spacing: .005em; }
    .usage-projection.is-hot { color: #b45309; }
    #empty { margin: 4px 2px 12px; color: #6b7280; font-size: 12px; line-height: 1.45; }
    .dot { width: 8px; height: 8px; margin-right: 7px; flex: none; border-radius: 999px; }
    #statusHead { display: flex; align-items: center; font-weight: 600; line-height: 1.35; letter-spacing: -.005em; }
    #statusIncident { margin-top: 5px; color: #6b7280; font-size: 12px; line-height: 1.4; }
    .comp { display: flex; align-items: center; margin-top: 5px; font-size: 12px; line-height: 1.4; }
    #statusLink { display: inline-block; margin-top: 8px; color: inherit; font-size: 12px; font-weight: 600; line-height: 1.35; letter-spacing: .005em; }
    #settings label, #acToggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .disclosure { overflow: hidden; }
    .disclosure-trigger { display: flex; width: 100%; align-items: center; justify-content: space-between; padding: 11px 12px; border: 0; color: inherit; background: transparent; cursor: pointer; font-size: 13px; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; text-align: left; }
    .chevron { color: #6b7280; font-size: 16px; line-height: 1; transition: transform 120ms ease-out; }
    .disclosure-trigger[aria-expanded="true"] .chevron { transform: rotate(90deg); }
    .disclosure-panel { padding: 0 12px 12px; border-top: 1px solid rgba(60, 60, 67, .1); opacity: 0; transform: translateY(-4px); transition: transform 140ms ease-out, opacity 120ms ease-out; }
    .disclosure-panel.is-open { opacity: 1; transform: translateY(0); }
    .accent-row, .ac-row { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
    .ac-row > .label { flex: 1; }
    #accent { width: 42px; height: 26px; padding: 0; border: 1px solid rgba(128, 128, 128, .35); border-radius: 6px; background: none; cursor: pointer; }
    #themeReset, #acPause, #acReset, #fontFamily, #acMax { padding: 5px 9px; border: 1px solid rgba(128, 128, 128, .35); border-radius: 6px; color: inherit; background: none; cursor: pointer; font-size: 12px; line-height: 1.25; }
    #acMax { width: 60px; cursor: text; }
    #acPause[disabled] { opacity: .45; cursor: default; }
    .opt { margin-top: 12px; }
    .opt > .label { display: block; margin-bottom: 4px; }
    .ticks { display: flex; justify-content: space-between; color: #6b7280; font-size: 11px; line-height: 1.3; letter-spacing: .01em; }
    #fontWeight, #radiusPreset, #fontFamily { width: 100%; }
    footer { margin-top: 10px; padding: 0 2px; color: #9ca3af; font-size: 11px; line-height: 1.3; letter-spacing: .01em; }
    @media (prefers-color-scheme: dark) {
      body { color: #f5f5f4; background: #1c1c1e; }
      .usage-card, .section, .disclosure { border-color: rgba(255, 255, 255, .12); background: #29292d; box-shadow: none; }
      .win + .win, .usage-projection, .disclosure-panel { border-color: rgba(255, 255, 255, .1); }
      .label, .reset, .ticks, #empty, .usage-projection, #statusIncident, .chevron { color: #a1a1aa; }
      .usage-projection.is-hot { color: #fbbf24; }
      footer { color: #71717a; }
    }
    @media (prefers-contrast: more) { .usage-card, .section, .disclosure { border-color: currentColor; } }
    @media (prefers-reduced-motion: reduce) {
      button, input[type="color"], input[type="checkbox"], input[type="number"], input[type="range"], select, #statusLink, .disclosure-panel, .chevron { transition-property: opacity; }
      button:active, input[type="color"]:active, input[type="checkbox"]:active, input[type="number"]:active, select:active, #statusLink:active, .disclosure-trigger[aria-expanded="true"] .chevron, .disclosure-panel { transform: none; }
    }
  </style>
</head>
<body>
  <div id="empty" hidden>Aucune donn&eacute;e pour l'instant. V&eacute;rifiez que vous &ecirc;tes connect&eacute; &agrave; claude.ai&nbsp;; le d&eacute;tail de l'&eacute;chec est dans la console du service worker.</div>
  <main>
    <section class="usage-card" aria-label="Usage Claude">
      <div id="windows" hidden></div>
      <div id="projection" class="usage-projection" hidden></div>
    </section>
    <section id="status" class="section" aria-labelledby="status-title" hidden>
      <h2 id="status-title" class="section-title">Statut Claude</h2>
      <div id="statusHead"></div>
      <div id="statusIncident" hidden></div>
      <div id="statusList"></div>
      <a id="statusLink" href="https://status.claude.com/" target="_blank" rel="noreferrer">Voir status.claude.com</a>
    </section>
    <section id="settings" class="section" aria-labelledby="settings-title">
      <h2 id="settings-title" class="section-title">Notifications</h2>
      <label><input type="checkbox" id="notif">Activer les notifications (seuils et fin de reset)</label>
    </section>
    <section id="autocontinue" class="disclosure" aria-labelledby="autocontinue-toggle">
      <button id="autocontinue-toggle" class="disclosure-trigger" type="button" aria-expanded="false" aria-controls="autocontinue-panel">Auto-continue <span class="chevron" aria-hidden="true">›</span></button>
      <div id="autocontinue-panel" class="disclosure-panel" hidden>
        <label id="acToggle"><input type="checkbox" id="acEnabled">Activer l'auto-continue</label>
        <div class="ac-row"><span class="label">Continuations max (0 = illimit&eacute;)</span><input type="number" id="acMax" min="0" max="999" step="1"></div>
        <div class="ac-row"><span id="acCount" class="label"></span></div>
        <div class="ac-row"><button type="button" id="acPause">Pause</button><button type="button" id="acReset">R&eacute;initialiser</button></div>
      </div>
    </section>
    <section id="theme" class="disclosure" aria-labelledby="theme-toggle">
      <button id="theme-toggle" class="disclosure-trigger" type="button" aria-expanded="false" aria-controls="theme-panel">Apparence de Claude <span class="chevron" aria-hidden="true">›</span></button>
      <div id="theme-panel" class="disclosure-panel" hidden>
        <div class="accent-row"><input type="color" id="accent" value="#c6613f" aria-label="Couleur d'accent"><button type="button" id="themeReset">R&eacute;initialiser</button></div>
        <div class="opt"><label class="label" for="fontWeight">Poids de police</label><input type="range" id="fontWeight" min="0" max="2" step="1" value="1"><div class="ticks"><span>Fin</span><span>Normal</span><span>Gras</span></div></div>
        <div class="opt"><label class="label" for="radiusPreset">Coins et ombres</label><input type="range" id="radiusPreset" min="0" max="2" step="1" value="1"><div class="ticks"><span>Carr&eacute;</span><span>Normal</span><span>Arrondi</span></div></div>
        <div class="opt"><label class="label" for="fontFamily">Police de lecture</label><select id="fontFamily"><option value="">D&eacute;faut</option><option value="sans">Sans-serif</option><option value="serif">Serif</option><option value="mono">Monospace</option></select></div>
      </div>
    </section>
  </main>
  <footer id="footer" hidden></footer>
  <script src="compat.js"></script>
  <script src="common.js"></script>
  <script src="autocontinue-source.js"></script>
  <script src="popup.js"></script>
</body>
</html>
