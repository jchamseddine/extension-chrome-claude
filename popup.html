<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Claude Usage</title>
  <style>
    body {
      font: 13px/1.45 system-ui, sans-serif;
      margin: 0;
      padding: 14px;
      width: 260px;
      color: #1c1c1e;
      background: #fff;
      /* Les controles natifs (range, select) ne suivent pas le theme sombre avec le seul
         background:none des autres controles ; c'est ce mot-cle qui les fait basculer. */
      color-scheme: light dark;
    }
    .win + .win { margin-top: 16px; }
    .head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .label { color: #6b7280; font-size: 12px; }
    .pct { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .bar {
      height: 6px;
      margin: 6px 0 4px;
      border-radius: 999px;
      background: rgba(128, 128, 128, .25);
      overflow: hidden;
    }
    .bar > i { display: block; height: 100%; border-radius: 999px; }
    .reset { color: #6b7280; font-size: 12px; }
    .status {
      display: inline-block;
      margin-top: 5px;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
      color: #fff;
    }
    .rule {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px solid rgba(128, 128, 128, .25);
    }
    #projection { font-size: 12px; color: #6b7280; }
    #projection.hot { color: #b45309; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      margin-right: 7px;
      flex: none;
    }
    .comp { display: flex; align-items: center; font-size: 12px; margin-top: 4px; }
    #statusHead { display: flex; align-items: center; margin-top: 2px; }
    #statusIncident { font-size: 12px; color: #6b7280; margin-top: 4px; }
    #statusLink { display: inline-block; margin-top: 8px; font-size: 12px; color: inherit; }
    #settings { font-size: 12px; }
    #settings label { display: flex; gap: 7px; align-items: center; cursor: pointer; }
    .accent-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    #accent {
      width: 44px;
      height: 26px;
      padding: 0;
      border: 1px solid rgba(128, 128, 128, .35);
      border-radius: 5px;
      background: none;
      cursor: pointer;
    }
    #themeReset, #fontFamily {
      font: inherit;
      font-size: 12px;
      padding: 4px 9px;
      border: 1px solid rgba(128, 128, 128, .35);
      border-radius: 5px;
      background: none;
      color: inherit;
      cursor: pointer;
    }
    /* Auto-continue : bloc autonome, comme la fonctionnalite. Rien d'autre ne s'en sert. */
    #acToggle { display: flex; gap: 7px; align-items: center; cursor: pointer; font-size: 12px; }
    .ac-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .ac-row > .label { flex: 1; }
    #acMax, #acPause, #acReset {
      font: inherit;
      font-size: 12px;
      padding: 4px 9px;
      border: 1px solid rgba(128, 128, 128, .35);
      border-radius: 5px;
      background: none;
      color: inherit;
      cursor: pointer;
    }
    #acMax { width: 60px; cursor: text; }
    #acPause[disabled] { opacity: .45; cursor: default; }
    .opt { margin-top: 10px; }
    .ticks {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #6b7280;
    }
    #fontWeight, #radiusPreset, #fontFamily { width: 100%; }
    #fontWeight, #radiusPreset { margin: 2px 0 0; }
    footer { color: #9ca3af; font-size: 11px; }
    #empty { color: #6b7280; }
    @media (prefers-color-scheme: dark) {
      body { color: #f5f5f4; background: #1c1c1e; }
      .label, .reset, .ticks, #empty, #projection, #statusIncident { color: #a1a1aa; }
      #projection.hot { color: #fbbf24; }
      footer { color: #71717a; }
    }
  </style>
</head>
<body>
  <div id="empty" hidden>Aucune donn&eacute;e pour l'instant. V&eacute;rifiez que vous &ecirc;tes connect&eacute; &agrave; claude.ai&nbsp;; le d&eacute;tail de l'&eacute;chec est dans la console du service worker.</div>
  <div id="windows" hidden></div>
  <div id="projection" class="rule" hidden></div>
  <div id="status" class="rule" hidden>
    <div class="label">Statut</div>
    <div id="statusHead"></div>
    <div id="statusIncident" hidden></div>
    <div id="statusList"></div>
    <a id="statusLink" href="https://status.claude.com/" target="_blank" rel="noreferrer">Voir status.claude.com</a>
  </div>
  <div id="settings" class="rule">
    <label>
      <input type="checkbox" id="notif">
      Activer les notifications (seuils et fin de reset)
    </label>
  </div>
  <div id="autocontinue" class="rule">
    <label id="acToggle">
      <input type="checkbox" id="acEnabled">
      Activer l'auto-continue
    </label>
    <div class="ac-row">
      <span class="label">Continuations max (0 = illimit&eacute;)</span>
      <input type="number" id="acMax" min="0" max="999" step="1">
    </div>
    <div class="ac-row"><span id="acCount" class="label"></span></div>
    <div class="ac-row">
      <button type="button" id="acPause">Pause</button>
      <button type="button" id="acReset">R&eacute;initialiser</button>
    </div>
  </div>
  <div id="theme" class="rule">
    <div class="label">Personnalisation</div>
    <div class="accent-row">
      <input type="color" id="accent" value="#c6613f">
      <button type="button" id="themeReset">R&eacute;initialiser</button>
    </div>
    <div class="opt">
      <div class="label">Poids de police</div>
      <input type="range" id="fontWeight" min="0" max="2" step="1" value="1">
      <div class="ticks"><span>Fin</span><span>Normal</span><span>Gras</span></div>
    </div>
    <div class="opt">
      <div class="label">Coins et ombres</div>
      <input type="range" id="radiusPreset" min="0" max="2" step="1" value="1">
      <div class="ticks"><span>Carr&eacute;</span><span>Normal</span><span>Arrondi</span></div>
    </div>
    <div class="opt">
      <div class="label">Police de lecture</div>
      <select id="fontFamily">
        <option value="">D&eacute;faut</option>
        <option value="sans">Sans-serif</option>
        <option value="serif">Serif</option>
        <option value="mono">Monospace</option>
      </select>
    </div>
  </div>
  <footer id="footer" class="rule" hidden></footer>
  <script src="common.js"></script>
  <script src="autocontinue-source.js"></script>
  <script src="popup.js"></script>
</body>
</html>
